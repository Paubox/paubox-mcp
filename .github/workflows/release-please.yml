name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Maintains a release PR that bumps package.json and writes CHANGELOG.md.
      # Merging that PR creates the tag and the GitHub release, which gates the
      # npm publish below.
      #
      # This versions the @paubox/mcp npm package only. The hosted server at
      # mcp.paubox.com deploys from main via deploy-prod.yml on its own cadence
      # and is deliberately not coupled to these releases.
      #
      # extra-files also carries the version literal in src/stdio.ts, which the
      # server reports to clients in the initialize handshake.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name }} to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for OIDC trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          # 24 for the npm it ships: trusted publishing needs npm >= 11.5.1,
          # and Node 22's npm 10.9 is too old — the OIDC exchange fails there
          # with a 404 on PUT, which reads like a missing package rather than a
          # client-version problem. pnpm enforces engines.node, so this only
          # works because that range is ">=22".
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build the stdio server
        # package.json ships only `dist` and its bin points at dist/stdio.js,
        # so this is the build that matters for the package. `pnpm build` is
        # the Next.js build for the hosted server and is not needed here.
        run: pnpm run build:stdio

      - name: Verify the tag, package.json and the built bin agree
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "v${PKG}" != "${RELEASE_TAG}" ]; then
            echo "::error::package.json is ${PKG} but the tag is ${RELEASE_TAG}"
            exit 1
          fi
          BIN=$(node -p "require('./package.json').bin['paubox-mcp']")
          test -f "$BIN" || { echo "::error::bin ${BIN} was not produced by build:stdio" >&2; exit 1; }
          echo "package.json ${PKG} matches ${RELEASE_TAG}, and ${BIN} exists"

      # Publishes over OIDC against the trusted publisher configured for this
      # repo and this workflow filename; there is no npm token anywhere.
      #
      # This step used to guard on `npm view` to handle the bootstrap case, npm
      # having no "pending publisher" for a package that does not exist yet.
      # @paubox/mcp exists now, and that guard could swallow a real release: a
      # transient `npm view` failure would take the warn-and-exit-0 branch and
      # leave a tag with nothing published behind it.
      - name: Publish to npm
        run: npm publish --provenance --access public
