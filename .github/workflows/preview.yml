# Per-PR ephemeral preview for paubox-mcp (ADR-037). Thin caller: this repo owns only the
# image build; the shared provision/teardown/verify/comment plumbing lives in
# Paubox/terraform-staging/.github/workflows/preview-deploy.yml (workflow_call). The
# per-PR task definition is rendered from the live pb-mcp-staging-webapp-task by that
# shared workflow, so env/secrets track shared staging automatically.
name: PR Preview Environment

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      action:
        description: "provision (default) or teardown"
        required: true
        default: provision
        type: choice
        options: [provision, teardown]
      pr_number:
        description: "PR number (required for teardown via dispatch)."
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: "195071949090"
  ECR_REGISTRY: 195071949090.dkr.ecr.us-west-2.amazonaws.com
  ROLE_TO_ASSUME: arn:aws:iam::195071949090:role/gha-mcp-preview
  ECR_REPOSITORY: pb-mcp-staging

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'provision') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       !github.event.pull_request.draft &&
       contains(github.event.pull_request.labels.*.name, 'needs-preview'))
    runs-on: ubuntu-latest
    environment: ecs-preview
    permissions:
      id-token: write
      contents: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      image_tag: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve PR number + ref
        id: pr
        run: |
          set -euo pipefail
          NUM="${{ github.event.pull_request.number || github.event.inputs.pr_number }}"
          [[ "$NUM" =~ ^[0-9]{1,6}$ ]] || { echo "::error::PR number '$NUM' must be 1-6 digits"; exit 1; }
          echo "number=$NUM" >> $GITHUB_OUTPUT
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            echo "ref=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "ref=refs/pull/$NUM/head" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - name: Get git commit SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Check if image already exists (immutable ECR)
        id: check
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag=${{ steps.sha.outputs.sha }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push preview image
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.sha.outputs.sha }}
          cache-from: type=gha,scope=pb-mcp-staging-preview
          cache-to: type=gha,mode=max,scope=pb-mcp-staging-preview

  deploy:
    needs: build
    uses: Paubox/terraform-staging/.github/workflows/preview-deploy.yml@master
    with:
      action: provision
      pr_number: ${{ needs.build.outputs.pr_number }}
      image_tag: ${{ needs.build.outputs.image_tag }}
      service_slug: pb-mcp
      short_name: mcp
      preview_prefix: mcp-pr
      host_label: mcp
      health_path: /api/health
      ephemeral_dir: ephemeral/paubox_mcp
    secrets:
      terraform_staging_ro_token: ${{ secrets.TERRAFORM_STAGING_RO_TOKEN }}

  teardown:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'teardown') ||
      (github.event_name == 'pull_request' &&
       (github.event.action == 'closed' ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'needs-preview')))
    uses: Paubox/terraform-staging/.github/workflows/preview-deploy.yml@master
    with:
      action: teardown
      pr_number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
      service_slug: pb-mcp
      short_name: mcp
      preview_prefix: mcp-pr
      host_label: mcp
      health_path: /api/health
      ephemeral_dir: ephemeral/paubox_mcp
    secrets:
      terraform_staging_ro_token: ${{ secrets.TERRAFORM_STAGING_RO_TOKEN }}
