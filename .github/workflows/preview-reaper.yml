# Reap stale paubox-mcp previews (ADR-037). Thin caller for the shared reaper in
# terraform-staging; dispatches this repo's preview.yml with action=teardown for any
# merged/closed/idle PR that still has a preview. Backstop to on-close teardown.
name: Reap Stale Preview Environments

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write
  pull-requests: read

jobs:
  reap:
    uses: Paubox/terraform-staging/.github/workflows/preview-reaper.yml@master
    with:
      service_slug: pb-mcp
      short_name: mcp
      preview_prefix: mcp-pr
      ephemeral_dir: ephemeral/paubox_mcp
      preview_workflow: preview.yml
