name: Deploy to Staging

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to staging"
        required: true
        default: "develop"
        type: string

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: paubox-mcp-server-staging
  ECR_REGISTRY: 285263271540.dkr.ecr.us-west-2.amazonaws.com
  ECS_CLUSTER: paubox-mcp-server-staging
  ECS_SERVICE: webapp-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.head_ref || github.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
          aws-secret-access-key: >-
            ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git commit SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get source branch name
        id: source-branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "branch=$(echo '${{ github.head_ref }}' | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT
          else
            echo "branch=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9]/-/g')" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.git-sha.outputs.sha }}
            type=raw,value=pr-${{ steps.source-branch.outputs.branch }}-${{ steps.git-sha.outputs.sha }},enable=${{ github.event_name == 'pull_request' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        uses: actions/github-script@v7
        with:
          script: |
            console.log(`Image digest: ${{ steps.build.outputs.digest }}`)
            console.log(`Git SHA: ${{ steps.git-sha.outputs.sha }}`)
            if ('${{ github.event_name }}' === 'pull_request') {
              console.log(`PR from: ${{ github.head_ref }}`)
              console.log(`PR to: ${{ github.base_ref }}`)
            }
            console.log(`Staging image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}`)
            console.log(`Source branch: ${{ steps.source-branch.outputs.branch }}`)

  deploy-to-ecs:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' # Only deploy on actual pushes, not PRs

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment
