name: Deploy Hotfix to Production

on:
  workflow_dispatch:
    inputs:
      hotfix_branch:
        description: "Branch to deploy (hotfix branch, feature branch, etc.)"
        required: true
        type: string
      confirm_hotfix:
        description: "Confirm this is an intentional hotfix deployment"
        required: true
        default: false
        type: boolean

# Shares deploy-prod's group because both target cluster
# paubox-mcp-server-production, service webapp-service, and must not race each
# other's UpdateService call.
#
# cancel-in-progress is true here, unlike deploy-prod. cancel-in-progress is a
# property of the INCOMING run, so this makes a hotfix preempt a routine deploy
# rather than wait behind it. Queueing would be wrong twice over during an
# incident: the hotfix would sit through the predecessor's ~10min stability
# wait, and GitHub cancels and replaces any already-pending run in a group, so
# a routine merge landing behind a queued hotfix would silently discard it.
#
# Cancelling the routine deploy's job does not stop the rollout ECS is already
# performing; the hotfix's own UpdateService supersedes it, and the final state
# is the hotfix revision.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: paubox-mcp-server-production
  ECR_REGISTRY: 285263271540.dkr.ecr.us-west-2.amazonaws.com
  ECS_CLUSTER: paubox-mcp-server-production
  ECS_SERVICE: webapp-service

jobs:
  validate-hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Validate hotfix confirmation
        if: ${{ !inputs.confirm_hotfix }}
        run: |
          echo "Error: Hotfix deployment must be explicitly confirmed"
          exit 1

      - name: Checkout code to validate branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.hotfix_branch }}

      - name: Validate branch exists
        run: |
          echo "Hotfix deployment confirmed for branch: ${{ inputs.hotfix_branch }}"
          echo "Current commit: $(git rev-parse --short HEAD)"

  build-and-deploy:
    needs: validate-hotfix
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.git-sha.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.hotfix_branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
          aws-secret-access-key: >-
            ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git commit SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Phase C (ADR-016/022): ECR is IMMUTABLE — skip the build when :<sha> already
      # exists (re-deploying an unchanged commit) rather than fail the re-push.
      - name: Check if image already exists
        id: imgexists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ steps.git-sha.outputs.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.git-sha.outputs.sha }}

      # Phase C: push ONLY the immutable :<sha> (dropped moving hotfix-*/latest tags —
      # they can't be re-pushed to an IMMUTABLE repo). The deploy pins this sha below.
      - name: Build and push Docker image
        id: build
        if: steps.imgexists.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  deploy-to-ecs:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.hotfix_branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Phase C (ADR-016/022): deploy the immutable :<sha> by registering a new revision
      # of the COMMITTED taskdef, instead of force-new-deployment on a moving tag.
      - name: Render task definition with the immutable image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef/production.json
          container-name: nextjs-app
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-deploy.outputs.sha }}

      - name: Deploy task definition
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Without this the step returns as soon as ECS accepts the update, so
          # the job goes green while tasks are still starting. The circuit
          # breaker is disabled on this service, so unhealthy tasks are retried
          # indefinitely rather than rolled back: the deployment simply never
          # reaches steady state and this wait is what turns that into a
          # failure. Observed healthy rollout is ~10min; 20 leaves headroom.
          wait-for-service-stability: true
          wait-for-minutes: 20

      - name: Output hotfix deployment info
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const deployed = '${{ steps.deploy.outcome }}' === 'success'
            console.log(deployed
              ? `🚨 HOTFIX DEPLOYMENT COMPLETED! 🚨`
              : `❌ HOTFIX DEPLOYMENT DID NOT COMPLETE — the service never reached steady state. Production is still serving the previous revision.`)
            console.log(`Branch: ${{ inputs.hotfix_branch }}`)
            console.log(`Git SHA: ${{ steps.git-sha.outputs.sha }}`)
            console.log(`Production image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}`)
            console.log(`⚠️  This deployment skipped staging environment!`)
