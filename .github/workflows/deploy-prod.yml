name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: paubox-mcp-server-production
  ECR_REGISTRY: 285263271540.dkr.ecr.us-west-2.amazonaws.com
  ECS_CLUSTER: paubox-mcp-server-production
  ECS_SERVICE: webapp-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.git-sha.outputs.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
          aws-secret-access-key: >-
            ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git commit SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Phase C (ADR-016/022): ECR is IMMUTABLE — skip the build when :<sha> already
      # exists (re-deploying an unchanged commit) rather than fail the re-push.
      - name: Check if image already exists
        id: imgexists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="${{ steps.git-sha.outputs.sha }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.git-sha.outputs.sha }}

      # Phase C: push ONLY the immutable :<sha> (no moving :latest — it can't be
      # re-pushed to an IMMUTABLE repo). The deploy pins this sha below.
      - name: Build and push Docker image
        id: build
        if: steps.imgexists.outputs.exists != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Output deployment info
        uses: actions/github-script@v7
        with:
          script: |
            console.log(`Production build completed!`)
            console.log(`Git SHA: ${{ steps.git-sha.outputs.sha }}`)
            console.log(`Production image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}`)

  deploy-to-ecs:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Phase C (ADR-016/022): deploy the immutable :<sha> by registering a new revision
      # of the COMMITTED taskdef, instead of force-new-deployment on a moving tag.
      - name: Render task definition with the immutable image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef/production.json
          container-name: nextjs-app
          image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-deploy.outputs.sha }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          # Without this the step returns as soon as ECS accepts the update, so
          # the job goes green while tasks are still starting — and stays green
          # if they fail their health checks and the deployment rolls back.
          wait-for-service-stability: true
