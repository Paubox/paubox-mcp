name: Deploy to Production

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      git_sha:
        description: 'Git commit SHA to deploy (from staging)'
        required: true
        type: string

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: paubox-mcp-server-production
  ECR_REGISTRY: 285263271540.dkr.ecr.us-west-2.amazonaws.com
  STAGING_ECR_REPOSITORY: paubox-mcp-server-staging

jobs:
  deploy-from-staging:
    runs-on: ubuntu-latest
    # Only run if PR was merged (not just closed)
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_GITHUB_ACTIONS_ACCESS_KEY_ID }}
          aws-secret-access-key: >-
            ${{ secrets.AWS_GITHUB_ACTIONS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get git commit SHA
        id: git-sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Pull image from staging ECR
        run: |
          docker pull ${{ env.ECR_REGISTRY }}/${{ env.STAGING_ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}

      - name: Tag image for production
        run: |
          # Tag the staging image for production ECR
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.STAGING_ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}
          docker tag ${{ env.ECR_REGISTRY }}/${{ env.STAGING_ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }} ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Push to production ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Output deployment info
        uses: actions/github-script@v7
        with:
          script: |
            console.log(`Production deployment completed!`)
            console.log(`Git SHA: ${{ steps.git-sha.outputs.sha }}`)
            console.log(`Source image: ${{ env.ECR_REGISTRY }}/${{ env.STAGING_ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}`)
            console.log(`Production image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.git-sha.outputs.sha }}`)
            console.log(`Latest: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest`)
